<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0" />
  <title>Transição Stinger — Miami Sunset (@yGabsxw)</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* Fundo 100% transparente para sobrepor cenas no OBS e no preview */
    html,
    body,
    .scene-root {
      background: transparent !important;
      pointer-events: none;
    }

    .stinger-stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      opacity: 0;
    }

    .stinger-stage.is-playing {
      opacity: 1;
    }

    /* ========================================================================
     *  CAMADAS DIAGONAIS (100% GPU-ACCELERATED @ 60FPS)
     *  Largura 2600px + skewX(-14deg) garante cobertura total sem frestas.
     * ======================================================================== */

    .wipe-layer {
      position: absolute;
      top: 0;
      left: -340px;
      width: 2600px;
      height: 1080px;
      will-change: transform;
      transform: skewX(-14deg) translate3d(-2420px, 0, 0);
    }

    /* 1. Faixa líder dourada / coral */
    .wipe-ribbon-lead {
      z-index: 10;
      background: linear-gradient(135deg, #ffd479 0%, #ff9466 52%, #e86878 100%);
      box-shadow: 0 0 60px rgba(255, 148, 102, 0.45);
    }

    /* 2. Lâmina intermediária ameixa / twilight */
    .wipe-blade-mid {
      z-index: 12;
      background: linear-gradient(180deg, #2b1647 0%, #56285c 52%, #3d2154 100%);
      border-right: 3px solid rgba(255, 250, 244, 0.72);
      border-left: 3px solid rgba(255, 212, 121, 0.55);
    }

    /* 3. Cortina principal Miami Sunset (cobre 100% da tela no ponto de corte) */
    .wipe-curtain-main {
      z-index: 14;
      overflow: hidden;
      background: #160c2a;
      border-right: 4px solid rgba(255, 212, 121, 0.85);
      border-left: 4px solid rgba(255, 250, 244, 0.65);
      box-shadow: 0 0 80px rgba(10, 4, 22, 0.85);
    }

    /* Contra-skew mantém a foto das palmeiras e a moldura perfeitamente retas */
    .wipe-curtain-inner {
      position: absolute;
      top: 0;
      left: 340px;
      width: 1920px;
      height: 1080px;
      transform: skewX(14deg);
      transform-origin: center center;
    }

    .curtain-photo {
      position: absolute;
      inset: -12px;
      background-image: url('assets/miami-sunset-bg.jpg');
      background-size: cover;
      background-position: center center;
      filter: saturate(1.06) brightness(0.62) blur(1.5px);
    }

    .curtain-tint {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 52%, rgba(255, 148, 102, 0.24) 0%, transparent 58%),
        linear-gradient(180deg, rgba(20, 10, 38, 0.82) 0%, rgba(58, 25, 68, 0.54) 50%, rgba(14, 7, 28, 0.88) 100%);
    }

    .curtain-frame {
      position: absolute;
      inset: 28px;
      border: 1.5px solid rgba(255, 250, 244, 0.48);
      box-shadow: inset 0 0 0 1px rgba(255, 212, 121, 0.16);
    }

    /* 4. Filete final de saída */
    .wipe-ribbon-trail {
      z-index: 16;
      width: 180px;
      left: 0;
      background: linear-gradient(180deg, #fffaf4 0%, #ffd479 45%, #e86878 100%);
      box-shadow: 0 0 40px rgba(255, 212, 121, 0.5);
    }

    /* ========================================================================
     *  EMBLEMA CENTRAL EDITORIAL (DURANTE A COBERTURA TOTAL)
     * ======================================================================== */

    .stinger-brand {
      position: absolute;
      inset: 0;
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.9);
      will-change: transform, opacity;
    }

    .brand-badge {
      position: relative;
      width: 132px;
      height: 132px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 10, 38, 0.86);
      box-shadow:
        0 20px 52px rgba(8, 3, 18, 0.72),
        0 0 48px rgba(255, 148, 102, 0.36);
    }

    .brand-badge::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 3px;
      background: linear-gradient(135deg, #fffaf4 0%, #ffd479 38%, #e86878 75%, #fffaf4 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    .brand-badge::after {
      content: "";
      position: absolute;
      inset: 9px;
      border-radius: 20px;
      border: 1px solid rgba(255, 250, 244, 0.28);
    }

    .brand-initials {
      font-family: var(--font-display);
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 0.02em;
      background: var(--grad-sunset);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 16px rgba(255, 148, 102, 0.35));
    }

    .brand-handle {
      margin-top: 24px;
      font-family: var(--font-display);
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 6px 28px rgba(10, 4, 22, 0.85);
    }

    .brand-divider {
      margin-top: 14px;
      width: 240px;
      height: 4px;
      border-radius: 999px;
      background: var(--grad-sunset-bar);
      transform: scaleX(0);
      will-change: transform;
      box-shadow: 0 0 18px rgba(255, 148, 102, 0.55);
    }

    .brand-tag {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 18px;
      border-radius: 999px;
      background: rgba(20, 11, 38, 0.72);
      border: 1px solid rgba(255, 250, 244, 0.34);
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sunset-gold);
    }
  </style>
</head>
<body>
  <main class="scene-root">
    <div id="stingerStage" class="stinger-stage" aria-hidden="true">
      <!-- Camadas do Wipe Diagonal -->
      <div id="wipeLead" class="wipe-layer wipe-ribbon-lead"></div>
      <div id="wipeMid" class="wipe-layer wipe-blade-mid"></div>

      <div id="wipeMain" class="wipe-layer wipe-curtain-main">
        <div class="wipe-curtain-inner">
          <div class="curtain-photo"></div>
          <div class="curtain-tint"></div>
          <div class="curtain-frame"></div>
        </div>
      </div>

      <div id="wipeTrail" class="wipe-layer wipe-ribbon-trail"></div>

      <!-- Emblema Central (Logo Oficial GTA 6 Animada + @apenasojorge) -->
      <div id="stingerBrand" class="stinger-brand">
        <video id="stingerLogoVideo" src="assets/gta6-logo-5s.webm" poster="assets/gta6-logo-static.png" muted playsinline style="width:460px;height:258px;object-fit:contain;filter:drop-shadow(0 18px 42px rgba(8, 3, 18, 0.88));margin-bottom:-8px;"></video>
        <div class="brand-handle" data-config="arroba">@apenasojorge</div>
        <div id="brandDivider" class="brand-divider"></div>
        <div class="brand-tag">
          <span class="live-dot live-dot--gold"></span>
          <span data-config="tagLive">AO VIVO</span>
        </div>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    (function () {
      const H = window.STREAM_HELPERS;
      H.bindTextFields();

      const stage = document.getElementById("stingerStage");
      const wipeLead = document.getElementById("wipeLead");
      const wipeMid = document.getElementById("wipeMid");
      const wipeMain = document.getElementById("wipeMain");
      const wipeTrail = document.getElementById("wipeTrail");
      const brand = document.getElementById("stingerBrand");
      const divider = document.getElementById("brandDivider");

      const durParam = Number(H.getUrlParam("dur"));
      const DURATION = Number.isFinite(durParam) && durParam >= 400 ? durParam : 1400;
      const DIR = H.getUrlParam("dir") === "left" ? -1 : 1;
      const IS_MANUAL = H.getUrlParam("manual") === "1";
      const IS_LOOP = H.getUrlParam("loop") === "1";

      // Curva Expo Ease-In-Out: começa suave, acelera forte no meio e desacelera no final
      const EASE_EXPO_IN_OUT = "cubic-bezier(0.87, 0, 0.13, 1)";
      const EASE_IN_OUT = "cubic-bezier(0.76, 0, 0.24, 1)";

      let activeAnims = [];
      let midpointTimer = null;

      function clearAnimations() {
        activeAnims.forEach((a) => a.cancel());
        activeAnims = [];
        if (midpointTimer) {
          clearTimeout(midpointTimer);
          midpointTimer = null;
        }
      }

      function playTransition(options = {}) {
        const dir = options.dir === "left" ? -1 : options.dir === "right" ? 1 : DIR;
        const duration = Number(options.dur) >= 400 ? Number(options.dur) : DURATION;

        clearAnimations();
        stage.classList.add("is-playing");
        const logoVid = document.getElementById("stingerLogoVideo");
        if (logoVid) {
          logoVid.currentTime = 0.6;
          logoVid.play().catch(() => {});
        }

        const startX = -2420 * dir;
        const endX = 2420 * dir;
        const trailStartX = dir === 1 ? -340 : 2080;
        const trailEndX = dir === 1 ? 2080 : -340;

        const skew = "skewX(-14deg)";
        const opts = { duration, easing: "linear", fill: "forwards" };

        // 1. Faixa líder (entra primeiro, sai primeiro)
        activeAnims.push(
          wipeLead.animate(
            [
              { transform: `${skew} translate3d(${startX}px, 0, 0)`, offset: 0, easing: EASE_EXPO_IN_OUT },
              { transform: `${skew} translate3d(0px, 0, 0)`, offset: 0.40 },
              { transform: `${skew} translate3d(0px, 0, 0)`, offset: 0.53, easing: EASE_EXPO_IN_OUT },
              { transform: `${skew} translate3d(${endX}px, 0, 0)`, offset: 0.93 },
              { transform: `${skew} translate3d(${endX}px, 0, 0)`, offset: 1 }
            ],
            opts
          )
        );

        // 2. Lâmina intermediária
        activeAnims.push(
          wipeMid.animate(
            [
              { transform: `${skew} translate3d(${startX}px, 0, 0)`, offset: 0 },
              { transform: `${skew} translate3d(${startX}px, 0, 0)`, offset: 0.03, easing: EASE_EXPO_IN_OUT },
              { transform: `${skew} translate3d(0px, 0, 0)`, offset: 0.43 },
              { transform: `${skew} translate3d(0px, 0, 0)`, offset: 0.55, easing: EASE_EXPO_IN_OUT },
              { transform: `${skew} translate3d(${endX}px, 0, 0)`, offset: 0.96 },
              { transform: `${skew} translate3d(${endX}px, 0, 0)`, offset: 1 }
            ],
            opts
          )
        );

        // 3. Cortina principal Miami Sunset (cobre 100% entre 45% e 57%, ponto de corte em 50%)
        const mainAnim = wipeMain.animate(
          [
            { transform: `${skew} translate3d(${startX}px, 0, 0)`, offset: 0 },
            { transform: `${skew} translate3d(${startX}px, 0, 0)`, offset: 0.06, easing: EASE_EXPO_IN_OUT },
            { transform: `${skew} translate3d(0px, 0, 0)`, offset: 0.46 },
            { transform: `${skew} translate3d(0px, 0, 0)`, offset: 0.57, easing: EASE_EXPO_IN_OUT },
            { transform: `${skew} translate3d(${endX}px, 0, 0)`, offset: 0.98 },
            { transform: `${skew} translate3d(${endX}px, 0, 0)`, offset: 1 }
          ],
          opts
        );
        activeAnims.push(mainAnim);

        // 4. Filete final de acabamento
        activeAnims.push(
          wipeTrail.animate(
            [
              { transform: `${skew} translate3d(${trailStartX}px, 0, 0)`, offset: 0 },
              { transform: `${skew} translate3d(${trailStartX}px, 0, 0)`, offset: 0.58, easing: EASE_EXPO_IN_OUT },
              { transform: `${skew} translate3d(${trailEndX}px, 0, 0)`, offset: 1 }
            ],
            opts
          )
        );

        // 5. Emblema central (@yGabsxw)
        activeAnims.push(
          brand.animate(
            [
              { opacity: 0, transform: "scale(0.88)", offset: 0 },
              { opacity: 0, transform: "scale(0.88)", offset: 0.25, easing: EASE_IN_OUT },
              { opacity: 1, transform: "scale(1)", offset: 0.42 },
              { opacity: 1, transform: "scale(1.015)", offset: 0.58, easing: EASE_IN_OUT },
              { opacity: 0, transform: "scale(1.06)", offset: 0.74 },
              { opacity: 0, transform: "scale(1.06)", offset: 1 }
            ],
            opts
          )
        );

        // 6. Linha gradiente sob o @handle
        activeAnims.push(
          divider.animate(
            [
              { transform: "scaleX(0)", offset: 0 },
              { transform: "scaleX(0)", offset: 0.30, easing: EASE_IN_OUT },
              { transform: "scaleX(1)", offset: 0.45 },
              { transform: "scaleX(1)", offset: 0.58, easing: EASE_IN_OUT },
              { transform: "scaleX(0)", offset: 0.72 },
              { transform: "scaleX(0)", offset: 1 }
            ],
            opts
          )
        );

        // Notifica o preview.html exatamente no ponto de corte (50%)
        midpointTimer = setTimeout(() => {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ transitionMidpoint: true }, "*");
          }
        }, Math.round(duration * 0.5));

        mainAnim.onfinish = () => {
          stage.classList.remove("is-playing");
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ transitionFinished: true }, "*");
          }
          if (IS_LOOP) {
            setTimeout(() => playTransition(options), 1000);
          }
        };
      }

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (data && data.playTransition) {
          playTransition(data);
        }
      });

      window.playStinger = playTransition;

      if (!IS_MANUAL) {
        requestAnimationFrame(() => playTransition());
      }
    })();
  </script>
</body>
</html>
