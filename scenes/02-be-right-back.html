<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>GTA 6 Stream Package - Já Volto / Be Right Back (3D)</title>
  <link rel="stylesheet" href="../shared/gta6-styles.css" />
  <style>
    .title-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -32px;
    }
    .stars-top {
      margin-bottom: 12px;
    }
    .script-sub {
      position: absolute;
      left: -12px;
      bottom: -8px;
      transform: rotate(-3deg);
      z-index: 15;
    }
    .timer-bottom {
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
    }
  </style>
</head>
<body class="bg-midnight-vice">
  <div class="ui-layer">
    <div class="title-container">
      <div id="stars-mount" class="stars-top"></div>
      <h1 id="main-title" class="gta-title">já volto</h1>
      <div id="sub-title" class="gta-script script-sub">Não Sai Daí</div>
    </div>
    <div id="countdown" class="gta-timer timer-bottom">07:54</div>
  </div>

  <canvas id="webgl" class="webgl-layer"></canvas>

  <script src="../shared/three.min.js"></script>
  <script src="../shared/gta6-3d-engine.js"></script>
  <script src="../shared/gta6-typography.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const lang = GTA6Typography.getLang();
    if (lang === 'en') {
      document.getElementById('main-title').textContent = 'be right back';
      document.getElementById('sub-title').textContent = 'Stay Tuned';
    } else {
      document.getElementById('main-title').textContent = params.get('title') || 'já volto';
      document.getElementById('sub-title').textContent = params.get('sub') || 'Não Sai Daí';
    }

    document.getElementById('stars-mount').innerHTML = GTA6Typography.createWantedStarsHTML(6, 36);
    GTA6Typography.startCountdown('countdown', 474);

    const canvas = document.getElementById('webgl');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    GTA6Engine.configureRenderer(renderer);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1920 / 1080, 0.1, 100);
    camera.position.set(0, 0, 14);

    GTA6Engine.setupViceLighting(scene, 'purple');
    const envMap = GTA6Engine.getStudioEnvMap(renderer, 'purple');

    // 1. Top-Left 3D Handcuffs (descending over left side of title)
    const handcuffs = GTA6Engine.createHandcuffs({ envMap });
    handcuffs.scale.set(1.66, 1.66, 1.66);
    handcuffs.position.set(-5.25, 2.38, 1.8);
    scene.add(handcuffs);

    // 2. Top-Right 3D Pink-Lit Glock Pistol (angled left)
    const pistol = GTA6Engine.createPistol({ variant: 'pink', envMap });
    pistol.scale.set(1.18, 1.18, 1.18);
    pistol.position.set(5.45, 3.1, 0.9);
    scene.add(pistol);

    // 3. Bottom-Center-Right 3D Cash Stack (cleanly to the right of 07:54 timer)
    const cashBottom = GTA6Engine.createCashStack({ envMap });
    cashBottom.scale.set(1.22, 1.22, 1.22);
    cashBottom.position.set(2.85, -3.55, 1.3);
    scene.add(cashBottom);

    // 4. Mid-Center Distant 3D Cash Stack
    const cashMid = GTA6Engine.createCashStack({ envMap });
    cashMid.scale.set(0.45, 0.45, 0.45);
    cashMid.position.set(0.85, -0.78, -2.5);
    scene.add(cashMid);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      handcuffs.position.y = 2.38 + Math.sin(t * 1.0) * 0.16;
      handcuffs.rotation.set(0.35 + Math.sin(t * 0.5) * 0.08, 0.25 + Math.cos(t * 0.6) * 0.1, -0.35);

      pistol.position.y = 3.1 + Math.cos(t * 1.1) * 0.14;
      pistol.rotation.set(0.18, Math.PI + 0.22 + Math.sin(t * 0.6) * 0.08, 0.15);

      cashBottom.position.y = -3.65 + Math.sin(t * 1.15 + 1.0) * 0.13;
      cashBottom.rotation.set(0.75 + Math.sin(t * 0.7) * 0.08, -0.38 + Math.cos(t * 0.6) * 0.1, 0.25);

      cashMid.position.y = -0.78 + Math.cos(t * 0.85) * 0.1;
      cashMid.rotation.set(0.4, -0.4 + t * 0.12, 0.15);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
