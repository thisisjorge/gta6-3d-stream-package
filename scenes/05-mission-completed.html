<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>GTA 6 Stream Package - Missão Concluída / Mission Completed (3D)</title>
  <link rel="stylesheet" href="../shared/gta6-styles.css" />
  <style>
    .mission-footer {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 25;
    }

    .mission-title {
      font-family: 'Pricedown', 'Anton', sans-serif;
      font-size: 98px;
      line-height: 0.86;
      text-align: center;
      text-transform: lowercase;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffe7d0 0%, #eab696 55%, #b87e74 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.95));
      margin-bottom: 16px;
      padding: 6px 14px;
    }
  </style>
</head>
<body>
  <div class="mission-footer">
    <div id="main-title" class="mission-title">missão<br/>concluída</div>
    <div id="stars-mount"></div>
  </div>

  <canvas id="webgl" class="webgl-layer"></canvas>

  <script src="../shared/three.min.js"></script>
  <script src="../shared/gta6-3d-engine.js"></script>
  <script src="../shared/gta6-typography.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const lang = GTA6Typography.getLang();
    if (lang === 'en') {
      document.getElementById('main-title').innerHTML = 'mission<br/>completed';
    } else if (params.has('title')) {
      document.getElementById('main-title').innerHTML = params.get('title');
    }

    document.getElementById('stars-mount').innerHTML = GTA6Typography.createWantedStarsHTML(6, 30);

    const canvas = document.getElementById('webgl');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    GTA6Engine.configureRenderer(renderer);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1920 / 1080, 0.1, 100);
    camera.position.set(0, 0, 14);

    GTA6Engine.setupViceLighting(scene, 'gold');
    const goldEnv = GTA6Engine.getStudioEnvMap(renderer, 'gold');

    // 1. Left Hero 3D Handcuffs (Violet/Silver Chrome, completely visible in frame)
    const handcuffs = GTA6Engine.createHandcuffs({ color: 0xa474ff, envMap: goldEnv });
    handcuffs.scale.set(1.22, 1.22, 1.22);
    handcuffs.position.set(-2.35, 0.08, 2.0);
    scene.add(handcuffs);

    // 2. Right Hero 3D Tactical Pistol (Warm Sunset Bronze/Gold Slide + Purple Stippled Grip)
    const pistol = GTA6Engine.createPistol({ variant: 'bronze', envMap: goldEnv });
    pistol.scale.set(1.52, 1.52, 1.52);
    pistol.position.set(2.35, 0.12, 2.2);
    scene.add(pistol);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      const introProgress = Math.min(1, t / 0.8);
      const easeOut = 1 - Math.pow(1 - introProgress, 3);

      handcuffs.scale.setScalar(1.22 * easeOut);
      pistol.scale.setScalar(1.52 * easeOut);

      handcuffs.position.y = 0.08 + Math.sin(t * 1.3) * 0.14;
      handcuffs.rotation.set(
        0.22 + Math.sin(t * 0.7) * 0.08,
        0.38 + Math.cos(t * 0.6) * 0.12,
        -0.18 + Math.sin(t * 0.5) * 0.06
      );

      pistol.position.y = 0.18 + Math.cos(t * 1.25) * 0.15;
      pistol.rotation.set(
        0.25 + Math.sin(t * 0.6) * 0.07,
        Math.PI - 0.35 + Math.cos(t * 0.7) * 0.1,
        0.65 + Math.sin(t * 0.5) * 0.05
      );

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
