<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>GTA 6 Stream Package - Intervalo / Intermission Screen (3D)</title>
  <link rel="stylesheet" href="../shared/gta6-styles.css" />
  <style>
    /* Palm leaf tropical shadow silhouettes across sunset backdrop */
    .palm-bg {
      position: absolute;
      inset: 0;
      opacity: 0.25;
      pointer-events: none;
      z-index: 2;
    }

    /* Header: INTERVALO Ao Vivo / INTERMISSION Screen */
    .intermission-header {
      position: absolute;
      top: 18px;
      left: 118px;
      z-index: 15;
      display: flex;
      align-items: baseline;
    }
    .intermission-title {
      font-family: 'Pricedown', 'Anton', sans-serif;
      font-size: 96px;
      letter-spacing: 2px;
      text-transform: lowercase;
      color: #ffffff;
      text-shadow: 0 8px 22px rgba(35, 10, 52, 0.82);
    }
    .intermission-script {
      font-family: 'Kaushan Script', 'Pacifico', cursive;
      font-size: 40px;
      color: #ffffff;
      margin-left: 8px;
      transform: translateY(10px) rotate(-4deg);
      text-shadow: 0 3px 14px rgba(255, 72, 196, 0.85);
    }

    /* Main 16:9 Gameplay Window (Left) */
    .gameplay-frame {
      position: absolute;
      top: 138px;
      left: 38px;
      width: 1344px;
      height: 790px;
      border-radius: 16px;
      border: 3px solid rgba(255, 140, 225, 0.72);
      box-shadow:
        0 18px 45px rgba(10, 6, 26, 0.68),
        inset 0 0 28px rgba(196, 78, 224, 0.35);
      background: rgba(18, 12, 34, 0.42);
      z-index: 8;
      overflow: hidden;
    }

    /* Top-Right Webcam Frame */
    .webcam-frame {
      position: absolute;
      top: 56px;
      right: 36px;
      width: 476px;
      height: 298px;
      border-radius: 16px;
      border: 3px solid rgba(255, 140, 225, 0.72);
      box-shadow: 0 14px 36px rgba(10, 6, 26, 0.65);
      background: rgba(25, 16, 46, 0.48);
      z-index: 8;
    }

    /* Right-Side Chat Box Frame */
    .chatbox-frame {
      position: absolute;
      top: 374px;
      right: 36px;
      width: 476px;
      height: 554px;
      border-radius: 16px;
      border: 3px solid rgba(130, 220, 255, 0.6);
      box-shadow: 0 14px 36px rgba(10, 6, 26, 0.65);
      background: linear-gradient(180deg, rgba(104, 62, 134, 0.56) 0%, rgba(26, 118, 152, 0.56) 100%);
      backdrop-filter: blur(8px);
      z-index: 8;
    }

    /* Depth-of-field blur canvas for foreground bottom-right handcuffs (just like KondorGFX Gallery 6) */
    .dof-layer {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
      z-index: 25;
      filter: blur(4.5px);
    }
  </style>
</head>
<body class="bg-intermission-vice">
  <!-- Tropical Palm Frond Silhouette Overlay -->
  <svg class="palm-bg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
    <g fill="#230b36">
      <path d="M1920,0 L1380,0 C1490,115 1670,210 1920,265 Z"/>
      <path d="M1920,80 C1680,140 1510,280 1390,460 C1580,360 1760,310 1920,320 Z"/>
      <path d="M1920,210 C1720,290 1570,430 1480,610 C1640,490 1790,430 1920,440 Z"/>
      <path d="M0,0 L480,0 C360,150 190,260 0,320 Z"/>
      <path d="M920,0 C990,190 1140,340 1340,440 C1190,220 1100,90 1080,0 Z"/>
    </g>
  </svg>

  <!-- Header Title -->
  <div class="intermission-header">
    <span id="main-title" class="intermission-title">intervalo</span>
    <span id="sub-title" class="intermission-script">Tela</span>
  </div>

  <!-- Layout Frames -->
  <div class="gameplay-frame" id="gameplay-slot"></div>
  <div class="webcam-frame" id="webcam-slot"></div>
  <div class="chatbox-frame" id="chat-slot"></div>

  <!-- Sharp 3D Layer (Top Cash, Bottom-Left Pistol, Center Star) -->
  <canvas id="webgl" class="webgl-layer"></canvas>

  <!-- Foreground DOF Blurred 3D Layer (Bottom-Right Handcuffs) -->
  <canvas id="webgl-dof" class="dof-layer"></canvas>

  <script src="../shared/three.min.js"></script>
  <script src="../shared/gta6-3d-engine.js"></script>
  <script src="../shared/gta6-typography.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const lang = GTA6Typography.getLang();
    if (lang === 'en') {
      document.getElementById('main-title').textContent = 'intermission';
      document.getElementById('sub-title').textContent = 'Screen';
    } else {
      document.getElementById('main-title').textContent = params.get('title') || 'intervalo';
      document.getElementById('sub-title').textContent = params.get('sub') || 'Ao Vivo';
    }

    if (params.get('transparent') === '1') {
      document.getElementById('gameplay-slot').style.background = 'transparent';
      document.getElementById('webcam-slot').style.background = 'transparent';
    }

    // Main Sharp WebGL Renderer
    const canvas = document.getElementById('webgl');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    GTA6Engine.configureRenderer(renderer);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1920 / 1080, 0.1, 100);
    camera.position.set(0, 0, 14);

    GTA6Engine.setupViceLighting(scene, 'purple');
    const envMap = GTA6Engine.getStudioEnvMap(renderer, 'purple');
    const goldEnv = GTA6Engine.getStudioEnvMap(renderer, 'gold');

    // 1. Top-Center 3D Cash Stack (overlapping top border of gameplay window)
    const cashTop = GTA6Engine.createCashStack({ envMap });
    cashTop.scale.set(1.38, 1.38, 1.38);
    cashTop.position.set(-1.35, 3.65, 1.4);
    scene.add(cashTop);

    // 2. Bottom-Left 3D Pink-Lit Glock Pistol (overlapping bottom-left corner of gameplay window)
    const pistol = GTA6Engine.createPistol({ variant: 'pink', envMap });
    pistol.scale.set(0.95, 0.95, 0.95);
    pistol.position.set(-6.55, -3.65, 2.0);
    scene.add(pistol);

    // 3. Center 3D Faceted Gold/Purple Star inside Gameplay Window (toggle via ?star=0)
    const showCenterStar = params.get('star') !== '0';
    const centerStar = GTA6Engine.createStar3D({
      outerRadius: 1.85,
      innerRadius: 0.72,
      depth: 0.52,
      envMap: goldEnv
    });
    centerStar.position.set(-1.72, -0.15, 0.8);
    centerStar.visible = showCenterStar;
    scene.add(centerStar);

    // Foreground DOF Renderer for Bottom-Right Handcuffs
    const dofCanvas = document.getElementById('webgl-dof');
    const dofRenderer = new THREE.WebGLRenderer({ canvas: dofCanvas, alpha: true, antialias: true });
    GTA6Engine.configureRenderer(dofRenderer);
    const dofScene = new THREE.Scene();
    GTA6Engine.setupViceLighting(dofScene, 'purple');
    const dofEnv = GTA6Engine.getStudioEnvMap(dofRenderer, 'purple');

    const handcuffs = GTA6Engine.createHandcuffs({ envMap: dofEnv });
    handcuffs.scale.set(1.42, 1.42, 1.42);
    handcuffs.position.set(6.25, -3.55, 2.2);
    dofScene.add(handcuffs);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      cashTop.position.y = 3.65 + Math.sin(t * 1.1) * 0.12;
      cashTop.rotation.set(1.12 + Math.sin(t * 0.6) * 0.06, -0.25 + Math.cos(t * 0.5) * 0.08, -1.15);

      pistol.position.y = -3.65 + Math.cos(t * 1.0) * 0.12;
      pistol.rotation.set(0.25, 0.28 + Math.sin(t * 0.6) * 0.08, -0.52);

      handcuffs.position.y = -3.55 + Math.sin(t * 0.95 + 1.0) * 0.14;
      handcuffs.rotation.set(0.35, -0.45 + Math.cos(t * 0.5) * 0.1, 0.25);

      if (centerStar.visible) {
        centerStar.rotation.y = Math.sin(t * 1.2) * 0.55;
        centerStar.rotation.z = Math.cos(t * 0.8) * 0.12;
        centerStar.position.y = -0.15 + Math.sin(t * 1.5) * 0.12;
      }

      renderer.render(scene, camera);
      dofRenderer.render(dofScene, camera);
    }
    animate();
  </script>
</body>
</html>
