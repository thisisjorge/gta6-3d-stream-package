<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>GTA 6 Stream Package - Encerrando / Ending Soon (3D)</title>
  <link rel="stylesheet" href="../shared/gta6-styles.css" />
  <style>
    .title-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -32px;
    }
    .stars-top {
      margin-bottom: 12px;
    }
    .script-sub {
      position: absolute;
      left: -25px;
      bottom: -8px;
      transform: rotate(-3deg);
      z-index: 15;
    }
    .timer-bottom {
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
    }
  </style>
</head>
<body class="bg-midnight-vice">
  <div class="ui-layer">
    <div class="title-container">
      <div id="stars-mount" class="stars-top"></div>
      <h1 id="main-title" class="gta-title">encerrando</h1>
      <div id="sub-title" class="gta-script script-sub">Obrigado Pela PresenÃ§a</div>
    </div>
    <div id="countdown" class="gta-timer timer-bottom">09:58</div>
  </div>

  <canvas id="webgl" class="webgl-layer"></canvas>

  <script src="../shared/three.min.js"></script>
  <script src="../shared/gta6-3d-engine.js"></script>
  <script src="../shared/gta6-typography.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const lang = GTA6Typography.getLang();
    if (lang === 'en') {
      document.getElementById('main-title').textContent = 'ending soon';
      document.getElementById('sub-title').textContent = 'Stream Is Currently';
    } else {
      document.getElementById('main-title').textContent = params.get('title') || 'encerrando';
      document.getElementById('sub-title').textContent = params.get('sub') || 'Obrigado Pela PresenÃ§a';
    }

    document.getElementById('stars-mount').innerHTML = GTA6Typography.createWantedStarsHTML(6, 36);
    GTA6Typography.startCountdown('countdown', 598);

    const canvas = document.getElementById('webgl');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    GTA6Engine.configureRenderer(renderer);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1920 / 1080, 0.1, 100);
    camera.position.set(0, 0, 14);

    GTA6Engine.setupViceLighting(scene, 'purple');
    const envMap = GTA6Engine.getStudioEnvMap(renderer, 'purple');

    // 1. Bottom-Left 3D Handcuffs
    const handcuffs = GTA6Engine.createHandcuffs({ envMap });
    handcuffs.scale.set(1.66, 1.66, 1.66);
    handcuffs.position.set(-4.85, -1.55, 1.8);
    scene.add(handcuffs);

    // 2. Bottom-Right Large 3D Pink-Lit Glock Pistol
    const pistol = GTA6Engine.createPistol({ variant: 'pink', envMap });
    pistol.scale.set(1.75, 1.75, 1.75);
    pistol.position.set(4.95, -2.55, 2.0);
    scene.add(pistol);

    // 3. Top-Right 3D Cash Stack
    const cashTopRight = GTA6Engine.createCashStack({ envMap });
    cashTopRight.scale.set(1.42, 1.42, 1.42);
    cashTopRight.position.set(2.35, 3.15, 1.0);
    scene.add(cashTopRight);

    // 4. Upper-Left Distant 3D Cash Stack
    const cashFarLeft = GTA6Engine.createCashStack({ envMap });
    cashFarLeft.scale.set(0.48, 0.48, 0.48);
    cashFarLeft.position.set(-3.4, 1.65, -2.5);
    scene.add(cashFarLeft);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      handcuffs.position.y = -1.55 + Math.sin(t * 1.05) * 0.16;
      handcuffs.rotation.set(0.32 + Math.sin(t * 0.5) * 0.08, 0.35 + Math.cos(t * 0.6) * 0.1, 0.25);

      pistol.position.y = -2.55 + Math.cos(t * 0.95) * 0.14;
      pistol.rotation.set(0.18 + Math.sin(t * 0.5) * 0.05, Math.PI - 0.28 + Math.cos(t * 0.6) * 0.07, 0.18);

      cashTopRight.position.y = 3.15 + Math.sin(t * 1.15 + 0.8) * 0.15;
      cashTopRight.rotation.set(0.68 + Math.sin(t * 0.7) * 0.08, -0.35 + Math.cos(t * 0.6) * 0.1, 0.28);

      cashFarLeft.position.y = 1.65 + Math.cos(t * 0.9) * 0.1;
      cashFarLeft.rotation.set(0.35, 0.45 + t * 0.12, -0.18);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
