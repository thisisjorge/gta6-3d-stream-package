<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>GTA 6 Stream Package - ComeÃ§ando em Breve / Starting Soon (3D)</title>
  <link rel="stylesheet" href="../shared/gta6-styles.css" />
  <style>
    .title-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -32px;
    }
    .stars-top {
      margin-bottom: 12px;
    }
    .script-sub {
      position: absolute;
      left: 10px;
      bottom: -8px;
      transform: rotate(-3deg);
      z-index: 15;
    }
    .timer-bottom {
      position: absolute;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
    }
  </style>
</head>
<body class="bg-midnight-vice">
  <div class="ui-layer">
    <div class="title-container">
      <div id="stars-mount" class="stars-top"></div>
      <h1 id="main-title" class="gta-title">comeÃ§ando</h1>
      <div id="sub-title" class="gta-script script-sub">A Live JÃ¡ Vai ComeÃ§ar</div>
    </div>
    <div id="countdown" class="gta-timer timer-bottom">04:57</div>
  </div>

  <canvas id="webgl" class="webgl-layer"></canvas>

  <script src="../shared/three.min.js"></script>
  <script src="../shared/gta6-3d-engine.js"></script>
  <script src="../shared/gta6-typography.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const lang = GTA6Typography.getLang();
    if (lang === 'en') {
      document.getElementById('main-title').textContent = 'starting soon';
      document.getElementById('sub-title').textContent = 'Stream Is Currently';
    } else {
      document.getElementById('main-title').textContent = params.get('title') || 'comeÃ§ando';
      document.getElementById('sub-title').textContent = params.get('sub') || 'A Live JÃ¡ Vai ComeÃ§ar';
    }

    document.getElementById('stars-mount').innerHTML = GTA6Typography.createWantedStarsHTML(6, 36);
    GTA6Typography.startCountdown('countdown', 297);

    const canvas = document.getElementById('webgl');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    GTA6Engine.configureRenderer(renderer);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(38, 1920 / 1080, 0.1, 100);
    camera.position.set(0, 0, 14);

    GTA6Engine.setupViceLighting(scene, 'purple');
    const envMap = GTA6Engine.getStudioEnvMap(renderer, 'purple');

    // 1. Top-Left 3D Cash Stack ($100 Franklin Bundle)
    const cashTopLeft = GTA6Engine.createCashStack({ envMap });
    cashTopLeft.scale.set(1.38, 1.38, 1.38);
    cashTopLeft.position.set(-5.75, 3.25, 0.9);
    scene.add(cashTopLeft);

    // 2. Distant Mid-Right Background 3D Cash Stack (Parallax Depth above handcuffs)
    const cashFarRight = GTA6Engine.createCashStack({ envMap });
    cashFarRight.scale.set(0.52, 0.52, 0.52);
    cashFarRight.position.set(4.15, 1.48, -3.4);
    scene.add(cashFarRight);

    // 3. Bottom-Left Large Pink-Lit 3D Tactical Glock Pistol
    const pistol = GTA6Engine.createPistol({ variant: 'pink', envMap });
    pistol.scale.set(1.98, 1.98, 1.98);
    pistol.position.set(-5.65, -2.55, 2.2);
    scene.add(pistol);

    // 4. Right-Side Large Dark Chrome Purple 3D Handcuffs
    const handcuffs = GTA6Engine.createHandcuffs({ envMap });
    handcuffs.scale.set(1.68, 1.68, 1.68);
    handcuffs.position.set(5.55, -1.05, 1.65);
    scene.add(handcuffs);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      cashTopLeft.position.y = 3.25 + Math.sin(t * 1.1) * 0.16;
      cashTopLeft.rotation.set(0.65 + Math.sin(t * 0.7) * 0.07, -0.42 + Math.cos(t * 0.6) * 0.09, 0.35);

      cashFarRight.position.y = 1.48 + Math.cos(t * 0.9) * 0.11;
      cashFarRight.rotation.set(0.38, 0.52 + t * 0.12, -0.22);

      pistol.position.y = -2.55 + Math.sin(t * 0.95 + 1.2) * 0.14;
      pistol.rotation.set(0.22 + Math.sin(t * 0.5) * 0.05, 0.32 + Math.cos(t * 0.6) * 0.06, -0.68);

      handcuffs.position.y = -1.05 + Math.cos(t * 1.05) * 0.18;
      handcuffs.rotation.set(0.28 + Math.sin(t * 0.6) * 0.08, -0.35 + Math.cos(t * 0.5) * 0.1, 0.18);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
