<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>GTA 6 Stream Package - Gameplay Live HUD (Facecam + Alertas 3D + Chat)</title>
  <link rel="stylesheet" href="../shared/gta6-styles.css" />
  <style>
    /* Positioned cleanly in the bottom-left or top-left for live gameplay */
    .hud-facecam-frame {
      position: absolute;
      top: 40px;
      left: -260px;
      width: 1920px;
      height: 1080px;
      border: none;
      transform: scale(0.56);
      transform-origin: top left;
      z-index: 20;
      pointer-events: none;
    }

    .hud-chat-frame {
      position: absolute;
      top: 50px;
      left: -355px;
      width: 1920px;
      height: 1080px;
      border: none;
      transform: scale(0.66);
      transform-origin: top left;
      z-index: 15;
      pointer-events: none;
    }

    .hud-mission-frame {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      border: none;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .hud-mission-frame.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <iframe id="cam-frame" class="hud-facecam-frame" src="06-facecam-alerts-widget.html?mode=subgoal&transparent=1&lang=pt"></iframe>
  <iframe id="chat-frame" class="hud-chat-frame" src="07-chat-widget.html?lang=pt"></iframe>
  <iframe id="mission-frame" class="hud-mission-frame" src="05-mission-completed.html?lang=pt"></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang') || 'pt';
    const transparent = params.get('transparent') !== '0' ? '1' : '0';
    const mode = params.get('mode') || 'subgoal';
    const alertType = params.get('alertType') || 'donate';
    const goal = params.get('goal') || 'follows';

    document.getElementById('cam-frame').src = `06-facecam-alerts-widget.html?mode=${mode}&alertType=${alertType}&goal=${goal}&icons=1&transparent=${transparent}&lang=${lang}`;
    document.getElementById('chat-frame').src = `07-chat-widget.html?lang=${lang}`;
    document.getElementById('mission-frame').src = `05-mission-completed.html?lang=${lang}`;

    // Forward alert triggers from Master Control Hub to Facecam iframe
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'TRIGGER_ALERT') {
        const cw = document.getElementById('cam-frame').contentWindow;
        if (cw) cw.postMessage(e.data, '*');
      }
    });

    // Trigger Mission Completed full-screen 3D celebration via window.triggerMissionCompleted()
    window.triggerMissionCompleted = function() {
      const mf = document.getElementById('mission-frame');
      mf.src = `05-mission-completed.html?lang=${lang}&t=${Date.now()}`;
      mf.classList.add('visible');
      setTimeout(() => mf.classList.remove('visible'), 5500);
    };
  </script>
</body>
</html>
